<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Meal Calendar | NutriMind</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nav.css">
<link rel="stylesheet" href="/theme.css">
<script>try{if(localStorage.getItem('nm-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;padding:40px 20px 80px;background-image:radial-gradient(ellipse at 15% 10%,rgba(91,155,213,.06) 0%,transparent 55%),radial-gradient(ellipse at 85% 90%,rgba(143,190,107,.05) 0%,transparent 50%)}
  header{text-align:center;margin:18px auto 30px;max-width:900px}
  h1{font-family:'Playfair Display',serif;font-size:clamp(32px,6vw,58px);font-weight:900;letter-spacing:-.03em;line-height:.95}
  h1 em{color:var(--accent);font-style:italic}
  .lead{color:var(--soft);font-size:15px;line-height:1.7;max-width:720px;margin:18px auto 0}
  .header-line{width:54px;height:2px;background:var(--accent);margin:18px auto 0;opacity:.55}
  .container{max-width:980px;margin:0 auto}

  .toolbar{display:flex;justify-content:flex-end;margin-bottom:18px}
  .btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:7px 14px;border-radius:20px;cursor:pointer;transition:all .2s;display:inline-block;text-decoration:none}
  .btn:hover{border-color:var(--accent);color:var(--accent)}

  .week-calendar{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .cal-day{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
  .cal-day.is-today{border-color:var(--accent)}
  .cal-day h4{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;margin:0 0 10px;color:var(--text)}
  .cal-row{font-size:12px;line-height:1.6;color:var(--muted);margin-bottom:10px}
  .cal-row b{color:var(--soft);font-weight:600;display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}

  .empty-note{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 22px;text-align:center;color:var(--soft);font-size:13.5px;line-height:1.7;margin-bottom:18px}
  .empty-note a{color:var(--accent)}
</style>
</head>
<body>

<header>
  <h1>Weekly Meal <em>Calendar</em></h1>
  <p class="lead">A read-only view of what you'll actually be eating each day this week — built from your Daily Meal Planner choices, "Surprise me" picks, and "Plan my week".</p>
  <div class="header-line"></div>
</header>

<main class="container">
  <div class="toolbar">
    <a class="btn" href="/work-meals">Edit my week</a>
  </div>
  <div id="calendarRoot"></div>
</main>

<script src="/nav.js"></script>
<script>
const SLOTS = [
  { id:"morning",   icon:"🌅", label:"Morning" },
  { id:"afternoon", icon:"☀️", label:"Afternoon" },
  { id:"night",     icon:"🌙", label:"Night" },
];

const DAYS = [
  { id:"mon", label:"Monday" }, { id:"tue", label:"Tuesday" }, { id:"wed", label:"Wednesday" },
  { id:"thu", label:"Thursday" }, { id:"fri", label:"Friday" }, { id:"sat", label:"Saturday" }, { id:"sun", label:"Sunday" },
];
const todayId = (() => { const map=["sun","mon","tue","wed","thu","fri","sat"]; return map[new Date().getDay()]; })();


const STORE_KEY = "work-meals:v3";

function slugify(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function escapeHtml(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function freshDinner() { return { type:null, pick:null, name:null, protein:null, carb:null, veg:[], sauce:null, meat:null, sides:[], from:null }; }
function freshLeftovers() { return { morning:"", afternoon:"", night:"" }; }
function dayLabel(id) { const d = DAYS.find(x => x.id === id); return d ? d.label : ""; }
function freshDay() {
  return {
    states:{ morning:"work", afternoon:"work", night:"work" }, checked:{}, ai:{}, dinner: freshDinner(), leftovers: freshLeftovers(),
  };
}

function describeDinner(d) {
  if (!d) return null;
  if (d.type === "out") return { main: "🍽️ Ordering out", sub: "" };
  if (d.type === "full") return { main: "✅ Already full", sub: "Ate enough earlier — skipping dinner." };
  if (d.name || d.protein || d.carb || (d.veg && d.veg.length)) {
    // A dinner picked from the dinner list lists only what was added to it; the heading is the dinner itself.
    const parts = d.pick
      ? [d.meat, ...(d.sides || [])].filter(Boolean).join(" · ")
      : [d.name ? cap(d.protein) : null, d.carb, (d.veg || []).join(" + "), d.sauce].filter(Boolean).join(" · ");
    // A leftover serving keeps the meal's own name and says which day's cook it came from.
    const from = d.from ? "♻️ Leftovers from " + dayLabel(d.from) + (parts ? " · " : "") : "";
    return { main: d.name || cap(d.protein) || "Dinner planned", sub: from + parts };
  }
  return null;
}

function checkedFoodsFor(day, slotId) {
  const aiList = (day.ai && day.ai[slotId]) || [];
  return [...(foodLists[slotId] || []), ...aiList].filter(name => day.checked[slotId + "|" + slugify(name)]);
}

function calendarSlotText(day, slot) {
  const st = day.states[slot.id] || "work";
  if (st === "skip") return "Hidden";
  const leftover = (day.leftovers || {})[slot.id];
  if (leftover && slot.id !== "night") return "♻️ Leftovers — " + leftover;
  if (slot.id === "night") {
    // A planned dinner shows whether the night is at work or at home — matching /work-meals.
    const summary = describeDinner(day.dinner);
    if (summary) return summary.main + (summary.sub ? " — " + summary.sub : "");
    return "Nothing planned yet";
  }
  if (st === "home") return "Eating at home";
  const picked = checkedFoodsFor(day, slot.id);
  return picked.length ? picked.join(", ") : "Not chosen yet";
}

let selectedDayForSave = todayId;
let foodLists = { morning:[], afternoon:[], night:[] };
// The dinner list and week-fill settings belong to /work-meals; this page only carries
// them through a save, so viewing the calendar never drops what was edited there.
let genSettings = null;
let dinnerList = null;
let planVersion = null;

function loadDays() {
  const days = {};
  for (const d of DAYS) days[d.id] = freshDay();
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && DAYS.some(d => d.id === saved.selectedDay)) selectedDayForSave = saved.selectedDay;
    if (saved && saved.gen) genSettings = saved.gen;
    if (Array.isArray(saved?.dinners)) dinnerList = saved.dinners;
    if (saved && saved.v !== undefined) planVersion = saved.v;
    if (saved && saved.days && typeof saved.days === "object") {
      for (const d of DAYS) {
        const sd = saved.days[d.id];
        if (sd && sd.states) {
          days[d.id] = Object.assign(freshDay(), sd, {
            states: Object.assign(freshDay().states, sd.states),
            dinner: Object.assign(freshDinner(), sd.dinner || {}),
            leftovers: Object.assign(freshLeftovers(), sd.leftovers || {}),
          });
          delete days[d.id].custom;
          delete days[d.id].customMode;
          delete days[d.id].customPick;
        }
      }
    }
    if (saved && saved.foodLists && typeof saved.foodLists === "object") {
      for (const slot of SLOTS.map(s => s.id)) {
        if (Array.isArray(saved.foodLists[slot])) foodLists[slot] = saved.foodLists[slot];
      }
    }
  } catch (e) { /* ignore */ }
  return days;
}

function planState() {
  const state = { selectedDay: selectedDayForSave, days, foodLists };
  if (genSettings) state.gen = genSettings;
  if (dinnerList) state.dinners = dinnerList;
  if (planVersion !== null) state.v = planVersion;
  return state;
}

function persist() {
  const state = planState();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  queueCalendarSync();
}

const root = document.getElementById("calendarRoot");
const days = loadDays();
let calendarRevision = 0;
let calendarSyncCode = "";
let calendarSyncTimer;
function queueCalendarSync() {
  if (!calendarSyncCode || !calendarRevision) return;
  clearTimeout(calendarSyncTimer);
  calendarSyncTimer = setTimeout(async () => {
    const plan = planState();
    try {
      const response = await fetch("/api/dinner-plan", { method:"PUT", headers:{ "content-type":"application/json", "x-sync-code":calendarSyncCode }, body:JSON.stringify({ plan, revision:calendarRevision }) });
      if (response.ok) calendarRevision = (await response.json()).revision;
    } catch (e) { /* local cache remains authoritative while offline */ }
  }, 700);
}
async function refreshCalendarSync() {
  try { calendarSyncCode = localStorage.getItem("work-meals:sync-code") || ""; } catch (e) { return; }
  if (!calendarSyncCode) return;
  try {
    const response = await fetch("/api/dinner-plan", { headers:{ "x-sync-code":calendarSyncCode } });
    if (!response.ok) return;
    const data = await response.json();
    calendarRevision = data.revision;
    if (sessionStorage.getItem("work-meals:calendar-loaded") !== calendarSyncCode + "|" + data.revision) {
      localStorage.setItem(STORE_KEY, JSON.stringify(data.plan));
      sessionStorage.setItem("work-meals:calendar-loaded", calendarSyncCode + "|" + data.revision);
      location.reload();
    }
  } catch (e) { /* render the offline cache */ }
}
refreshCalendarSync();

function hasAnyPlan() {
  return DAYS.some(d => {
    const day = days[d.id];
    return !!describeDinner(day.dinner) || Object.values(day.checked).some(Boolean)
      || Object.values(day.leftovers || {}).some(v => v && v.trim());
  });
}

function updateHint() {
  document.getElementById("planHint").innerHTML = hasAnyPlan() ? "" : `<div class="empty-note">No meals planned yet. Head to the <a href="/work-meals">Daily Meal Planner</a> to pick your dinners and tick off the foods you're taking.</div>`;
}

function renderGrid() {
  const html = `<div class="week-calendar">${DAYS.map(d => {
    const day = days[d.id];
    const rows = SLOTS.map(slot => {
      const isHidden = (day.states[slot.id] || "work") === "skip";
      // Slot text is plain text built from the reader's own food and dinner names.
      const slotText = isHidden ? "" : escapeHtml(calendarSlotText(day, slot));
      return `<div class="cal-row"><b>${slot.icon} ${slot.label}</b>${slotText}</div>`;
    }).join("");
    return `<div class="cal-day${d.id === todayId ? " is-today" : ""}"><h4>${d.label}</h4>${rows}</div>`;
  }).join("")}</div>`;
  document.getElementById("calGrid").innerHTML = html;
}

root.innerHTML = `<div id="planHint"></div><div id="calGrid"></div>`;
renderGrid();
updateHint();

</script>
</body>
</html>
